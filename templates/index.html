<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ data.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 24, 38, 0.85);
            --accent-color: #ff0055;
            --text-color: #ffffff;
            --text-sub: #94a3b8;
        }

        .theme-red { --accent-color: #ff0055; }
        .theme-midnight { --accent-color: #00f2fe; }
        .theme-gold { --accent-color: #fbbf24; }
        .theme-emerald { --accent-color: #10b981; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px 16px 50px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Profile Card */
        .profile-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px 16px;
            border-radius: 24px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .avatar {
            width: 95px; height: 95px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
            margin-bottom: 12px;
            box-shadow: 0 0 15px var(--accent-color);
            background: #1e293b;
        }
        .title { font-size: 22px; font-weight: 900; margin-bottom: 2px; }
        .tagline { font-size: 13px; font-weight: 700; color: var(--accent-color); margin-bottom: 8px; }
        .bio { font-size: 13px; color: var(--text-sub); line-height: 1.4; white-space: pre-line; }

        /* Links Card */
        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 18px;
            border-radius: 16px;
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            font-size: 14px;
            transition: 0.2s;
            backdrop-filter: blur(10px);
        }
        .link-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        .link-left { display: flex; align-items: center; gap: 12px; }
        .link-left i { font-size: 18px; color: var(--accent-color); }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            margin-top: 20px;
        }
    </style>
</head>
<body class="{{ data.theme|default('theme-red') }}">
    <div class="container">
        <!-- Profile Section -->
        <div class="profile-card">
            <img src="{{ data.avatar_url|default('/static/uploads/logo.svg') }}" onerror="this.onerror=null;this.src='/static/uploads/logo.svg';" class="avatar" alt="Profile">
            <h1 class="title">{{ data.title }}</h1>
            <div class="tagline">{{ data.tagline }}</div>
            <p class="bio">{{ data.bio }}</p>
        </div>

        <!-- Links List -->
        {% for link in data.links %}
        <a href="/click/{{ loop.index0 }}" target="_blank" class="link-card">
            <div class="link-left">
                <i class="{{ link.icon }}"></i>
                <span>{{ link.name }}</span>
            </div>
            <i class="fa-solid fa-chevron-right" style="font-size: 11px; color: #64748b;"></i>
        </a>
        {% endfor %}

        <div class="footer">
            © 2026 {{ data.title }} • All Rights Reserved
        </div>
    </div>
</body>
</html>
