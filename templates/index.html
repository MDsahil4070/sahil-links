cat << 'EOF' > templates/index.html
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ data.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #0f172a; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; justify-content: center; padding: 30px 15px; }
        .box { width: 100%; max-width: 400px; text-align: center; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #38bdf8; margin-bottom: 12px; object-fit: cover; }
        h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        .btn { display: block; background: #1e293b; border: 1px solid #334155; padding: 14px; border-radius: 12px; color: #fff; text-decoration: none; font-weight: 700; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <img src="{{ data.avatar_url }}" class="avatar" alt="Avatar">
        <h1>{{ data.title }}</h1>
        <p>{{ data.tagline }}</p>
        {% for link in data.links %}
        <a href="/click/{{ loop.index0 }}" target="_blank" class="btn"><i class="{{ link.icon }}"></i> {{ link.name }}</a>
        {% endfor %}
    </div>
</body>
</html>
EOF
