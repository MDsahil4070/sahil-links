<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ data.title }} | Official Bio & Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* 📸 फोटो वाला बिल्कुल सटीक डार्क मैरून/रेड बैकग्राउंड और ग्लास कार्ड लुक */
        body {
            background-color: #120305;
            background-image: radial-gradient(circle at 50% 20%, #4a0510 0%, #120305 70%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .profile-card {
            background: rgba(30, 8, 12, 0.75);
            border: 1px solid rgba(255, 77, 109, 0.2);
            border-radius: 32px;
            padding: 32px 24px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .avatar-wrap {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 16px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff4d6d;
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.4);
        }

        .badge-verified {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: #0ea5e9;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            border: 2px solid #120305;
        }

        .profile-title {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .profile-tag {
            font-size: 14px;
            font-weight: 700;
            color: #ff4d6d;
            margin-bottom: 12px;
        }

        .profile-bio {
            font-size: 13.5px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 24px;
            white-space: pre-line;
        }

        .share-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            text-decoration: none;
        }

        .share-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: #ff4d6d;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="profile-card">
            <div class="avatar-wrap">
                <img src="{{ data.avatar_url }}" onerror="this.src='/static/uploads/avatar.jpg'" class="avatar-img" alt="Sahil">
                <div class="badge-verified"><i class="fa-solid fa-check"></i></div>
            </div>
            <h1 class="profile-title">{{ data.title }}</h1>
            <div class="profile-tag">{{ data.tagline }}</div>
            <p class="profile-bio">{{ data.bio }}</p>
            
            <a href="javascript:void(0);" onclick="navigator.clipboard.writeText(window.location.href); alert('Link Copied to Clipboard!');" class="share-btn">
                <i class="fa-solid fa-share-nodes"></i> Share Bio Link
            </a>
        </div>
    </div>
</body>
</html>
